<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#141a26;color:#e9e3d6;font:15px/1.5 'Instrument Sans','Segoe UI',system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow-x:hidden}
.orb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.acc{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:18px;padding:34px 36px;border-radius:22px;background:rgba(20,26,38,.88);border:1px solid rgba(226,194,122,.35);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.acc img{width:64px;height:64px;align-self:center}
.t{text-align:center}.t b{display:block;font:600 30px/1.1 Fraunces,Georgia,serif;color:#fff}
.t small{font:600 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;text-transform:uppercase;color:#e2c27a}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:#cfc8b8}
.fw{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 14px;border-radius:12px;border:2px solid #e2c27a;background:rgba(255,255,255,.06)}
.fw.err{border-color:#f2a69c}
.fw svg{flex:none;color:#cfc8b8}
.fw input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:600 16px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1px;outline:none}
.fw button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#cfc8b8;cursor:pointer}
.fw button:hover,.fw button:focus-visible{background:rgba(255,255,255,.1);color:#fff}
.fw:focus-within{box-shadow:0 0 0 3px rgba(226,194,122,.35)}
.msg{margin:-8px 0 0;min-height:1.2em;color:#f2a69c;font-size:13px;font-weight:600}
label.c{display:flex;align-items:center;gap:10px;font-size:14px;color:#e9e3d6;cursor:pointer}
label.c input{width:18px;height:18px;accent-color:#b98a24}
.go{height:50px;border-radius:12px;border:0;background:#b98a24;color:#141a26;font:700 15px 'Instrument Sans',system-ui,sans-serif;cursor:pointer}
.go:hover{background:#cc9b30}.go:focus-visible{outline:3px solid #fff;outline-offset:2px}.go:disabled{opacity:.7;cursor:wait}
.n{margin:0;text-align:center;font-size:12.5px;color:#b0a690}
noscript p{color:#fff;text-align:center}
@media (max-width:480px){.acc{padding:26px 20px}.t b{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.orb .p{animation:tour 90s linear infinite;transform-origin:50% 50%}}
@keyframes tour{to{transform:rotate(360deg)}}
</style>
</head>

  function lire(n) { try { var l = localStorage.getItem(n);
      if (l) { var x = +localStorage.getItem(EXP) || 0;
        if (!x) localStorage.setItem(EXP, String(Date.now() + DUREE));
        else if (Date.now() > x) { localStorage.removeItem(n); localStorage.removeItem(EXP); l = null; } }
      return l || sessionStorage.getItem(n); } catch (e) { return null; } }
  function garder(raw, mem) { try { sessionStorage.setItem(KEY, raw);
      if (mem) { localStorage.setItem(KEY, raw); localStorage.setItem(EXP, String(Date.now() + DUREE)); } else { localStorage.removeItem(KEY); localStorage.removeItem(EXP); } } catch (e) {} }
  function oublier() { try { localStorage.removeItem(KEY); localStorage.removeItem(EXP); sessionStorage.removeItem(KEY); } catch (e) {} }
  async function derive(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(D.salt), iterations: D.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  /* Fichiers du carnet (images, polices, textes des cours) : chacun est chiffré à part dans ressources/<nom>.bin
     (12 octets d'IV puis le texte chiffré, même clé que la page). Ils sont déchiffrés ici, puis remis dans la page
     sous la forme où elle les attend (images et polices en data:, textes des cours en scripts), donc rien de nouveau
     pour la politique de sécurité du contenu. Une erreur réseau ("res") n'efface pas la clé mémorisée. */
  async function fichier(key, chemin) {
    var r; try { r = await fetch("ressources/" + chemin + ".bin"); } catch (e) { throw "res"; }
    if (!r.ok) throw "res";
    var u = new Uint8Array(await r.arrayBuffer());
    try { return await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.subarray(0, 12) }, key, u.subarray(12)); } catch (e) { throw "res"; }
  }
  async function ouvrir(key) {
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.iv) }, key, b(CT));
    var html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    var RES = /ressources\/((?:images|polices)\/[0-9a-f]{16}\.(?:webp|woff))/g;
    var SCR = /<script src="ressources\/(cours\/[A-Za-z0-9._-]+\.js)"><\/script>/g;
    var cours = [], m; while ((m = SCR.exec(html))) cours.push(m[1]);
    var textes = await Promise.all(cours.map(async function (c) { return new TextDecoder().decode(await fichier(key, c)); }));
    var refs = {}, x; [html].concat(textes).forEach(function (t) { RES.lastIndex = 0; while ((x = RES.exec(t))) refs[x[1]] = 1; });
    var data = {};
    await Promise.all(Object.keys(refs).map(async function (r) {
      data[r] = "data:" + (/\.webp$/.test(r) ? "image/webp" : "font/woff") + ";base64," + e64(await fichier(key, r)); }));
    var sub = function (t) { return t.replace(RES, function (_, r) { return data[r]; }); };
    html = sub(html).replace(SCR, function (_, c) { return "<script>" + sub(textes[cours.indexOf(c)]).replace(/<\/script/gi, "<\\/script") + "<\/script>"; });
    /* Safari : réécrire la page avant la fin de son chargement (ouverture automatique par mot de passe mémorisé)
       l'empêche ensuite d'ouvrir tout nouvel onglet ; on attend donc le chargement complet, puis un court instant. */
    if (document.readyState !== "complete") await new Promise(function (r) { addEventListener("load", r, { once: true }); });
    await new Promise(function (r) { setTimeout(r, 60); });
    CT = null; document.open(); document.write(html); document.close();
    /* la page écrite remplace l'en-tête : on y remet le manifeste et l'icône (installation sur l'écran d'accueil) */
    [["manifest", "manifest.webmanifest"], ["apple-touch-icon", "icone-180.png"]].forEach(function (x) { var l = document.createElement("link"); l.rel = x[0]; l.href = x[1]; document.head.appendChild(l); });
  }
  async function auto() {
    var raw = lire(KEY); if (!raw) return false;
    try { var k = await crypto.subtle.importKey("raw", b(raw), { name: "AES-GCM" }, false, ["decrypt"]); await ouvrir(k); return true; }
    catch (e) { if (e === "res") { $("msg").textContent = "Les fichiers du carnet sont inaccessibles : vérifiez la connexion."; } else oublier(); return false; }
  }
  function pret() {
    if (!(window.crypto && crypto.subtle && window.DecompressionStream)) { $("msg").textContent = "Ce navigateur est trop ancien pour ouvrir le carnet. Mettez-le à jour."; $("go").disabled = true; return; }
    $("pw").focus();
  }
  $("eye").onclick = function () { var p = $("pw"), v = p.type === "password"; p.type = v ? "text" : "password"; this.setAttribute("aria-pressed", String(v)); this.setAttribute("aria-label", v ? "Masquer le mot de passe" : "Afficher le mot de passe"); p.focus(); };
  $("acc").onsubmit = async function (ev) {
    ev.preventDefault(); var pw = $("pw").value; if (!pw) { $("msg").textContent = "Saisissez le mot de passe."; return; }
    $("go").disabled = true; $("go").textContent = "Ouverture…"; $("msg").textContent = "";
    try { var k = await derive(pw); await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.iv) }, k, b(CT)).then(function () {}, function () { throw "mdp"; });
      garder(e64(await crypto.subtle.exportKey("raw", k)), $("mem").checked); await ouvrir(k); }
    catch (e) { $("go").disabled = false; $("go").textContent = "Entrer dans le carnet"; $("fw").classList.add("err"); $("pw").setAttribute("aria-invalid", "true");
      $("msg").textContent = e === "mdp" ? "Mot de passe incorrect. Vérifiez les majuscules et les tirets." : e === "res" ? "Les fichiers du carnet sont inaccessibles : vérifiez la connexion." : "Le carnet n’a pas pu s’ouvrir sur ce navigateur."; $("pw").select(); }
  };
  /* hors ligne : le site garde une copie de la page chiffrée et des polices (sw.js) */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(function () {});
  auto().then(function (ok) { if (!ok) pret(); });
})();
</script>
