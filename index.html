<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#141a26;color:#e9e3d6;font:15px/1.5 'Instrument Sans','Segoe UI',system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow-x:hidden}
.orb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.acc{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:18px;padding:34px 36px;border-radius:22px;background:rgba(20,26,38,.88);border:1px solid rgba(226,194,122,.35);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.acc img{width:64px;height:64px;align-self:center}
.t{text-align:center}.t b{display:block;font:600 30px/1.1 Fraunces,Georgia,serif;color:#fff}
.t small{font:600 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;text-transform:uppercase;color:#e2c27a}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:#cfc8b8}
.fw{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 14px;border-radius:12px;border:2px solid #e2c27a;background:rgba(255,255,255,.06)}
.fw.err{border-color:#f2a69c}
.fw svg{flex:none;color:#cfc8b8}
.fw input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:600 16px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1px;outline:none}
.fw button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#cfc8b8;cursor:pointer}
.fw button:hover,.fw button:focus-visible{background:rgba(255,255,255,.1);color:#fff}
.fw:focus-within{box-shadow:0 0 0 3px rgba(226,194,122,.35)}
.msg{margin:-8px 0 0;min-height:1.2em;color:#f2a69c;font-size:13px;font-weight:600}
label.c{display:flex;align-items:center;gap:10px;font-size:14px;color:#e9e3d6;cursor:pointer}
label.c input{width:18px;height:18px;accent-color:#b98a24}
.go{height:50px;border-radius:12px;border:0;background:#b98a24;color:#141a26;font:700 15px 'Instrument Sans',system-ui,sans-serif;cursor:pointer}
.go:hover{background:#cc9b30}.go:focus-visible{outline:3px solid #fff;outline-offset:2px}.go:disabled{opacity:.7;cursor:wait}
.n{margin:0;text-align:center;font-size:12.5px;color:#b0a690}
noscript p{color:#fff;text-align:center}
@media (max-width:480px){.acc{padding:26px 20px}.t b{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.orb .p{animation:tour 90s linear infinite;transform-origin:50% 50%}}
@keyframes tour{to{transform:rotate(360deg)}}
</style>
</head>

  /* Fichiers du carnet (images, polices, textes des cours) : chacun est chiffré à part dans ressources/<nom>.bin

  async function fichier(key, chemin) {
